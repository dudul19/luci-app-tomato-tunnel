="390" class="t1" text-anchor="start" font-size="15" font-weight="600">Memory (RSS)</text><text x="24" y="431" class="t1" text-anchor="start" font-size="13" font-weight="600">Idle</text><text x="198" y="426" class="t2" text-anchor="end" font-size="13" font-weight="400">SSH + TLS</text><rect class="tt" x="210.0" y="416" width="107.7" height="20"/><path class="hv" d="M319.7,416 h9.7 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-9.7 z"/><text x="341.35999999999996" y="431" class="t1" text-anchor="start" font-size="12" font-weight="600">18 MB</text><text x="198" y="460" class="t2" text-anchor="end" font-size="13" font-weight="400">Xray Trojan WS TLS</text><rect class="tt" x="210.0" y="450" width="107.7" height="20"/><rect class="xr" x="319.7" y="450" width="285.8" height="20"/><path class="hv" d="M607.5,450 h16.6 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-16.6 z"/><text x="636.0533333333333" y="465" class="t1" text-anchor="start" font-size="12" font-weight="600">61 MB</text><text x="24" y="513" class="t1" text-anchor="start" font-size="13" font-weight="600">Full load</text><text x="198" y="508" class="t2" text-anchor="end" font-size="13" font-weight="400">SSH + TLS</text><rect class="tt" x="210.0" y="498" width="128.2" height="20"/><path class="hv" d="M340.2,498 h9.7 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-9.7 z"/><text x="361.92" y="513" class="t1" text-anchor="start" font-size="12" font-weight="600">21 MB</text><text x="198" y="542" class="t2" text-anchor="end" font-size="13" font-weight="400">Xray Trojan WS TLS</text><rect class="tt" x="210.0" y="532" width="107.7" height="20"/><rect class="xr" x="319.7" y="532" width="285.8" height="20"/><path class="hv" d="M607.5,532 h16.6 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-16.6 z"/><text x="636.0533333333333" y="547" class="t1" text-anchor="start" font-size="12" font-weight="600">61 MB</text><text x="210.0" y="572" class="t3" text-anchor="middle" font-size="11" font-weight="400">0 MB</text><text x="381.3333333333333" y="572" class="t3" text-anchor="middle" font-size="11" font-weight="400">25 MB</text><text x="552.6666666666666" y="572" class="t3" text-anchor="middle" font-size="11" font-weight="400">50 MB</text><text x="724.0" y="572" class="t3" text-anchor="middle" font-size="11" font-weight="400">75 MB</text>
<text x="24" y="606" class="t3" font-size="11">CPU: 100% means one CPU core is fully busy. The test router has 6 cores, so 100% is about 17% of the whole chip.</text><text x="24" y="622" class="t3" font-size="11">Boxes with slower cores (e.g. S905X / Cortex-A53 STBs) need more per core for the same speed.</text><text x="24" y="638" class="t3" font-size="11">Router: King3399 (RK3399, 2 GB), ImmortalWrt, Tomato Tunnel 1.5.0, TUN mode, same VPS. Full load = one HTTP</text><text x="24" y="654" class="t3" font-size="11">download / upload from a LAN PC at 40-60 Mbps. CPU and RSS sampled every 1 s from /proc, averaged over the transfer.</text>
