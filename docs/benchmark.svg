<text x="40.0" y="740.0" class="t3" font-size="12" font-weight="400" text-anchor="start">Router</text>
<text x="162.0" y="740.0" class="t2" font-size="12" font-weight="400" text-anchor="start">King3399 (RK3399, 6 cores, 2 GB), ImmortalWrt, TUN mode</text>
<text x="40.0" y="758.0" class="t3" font-size="12" font-weight="400" text-anchor="start">Accounts</text>
<text x="162.0" y="758.0" class="t2" font-size="12" font-weight="400" text-anchor="start">SSH = SSH + TLS · Xray = Trojan WS TLS · Balance = 2 Xray accounts, one on a USB modem, one on a phone</text>
<text x="40.0" y="776.0" class="t3" font-size="12" font-weight="400" text-anchor="start">Load</text>
<text x="162.0" y="776.0" class="t2" font-size="12" font-weight="400" text-anchor="start">8 downloads or uploads at once from a LAN PC; the speed reached is shown next to each CPU value</text>
<text x="40.0" y="794.0" class="t3" font-size="12" font-weight="400" text-anchor="start">Method</text>
<text x="162.0" y="794.0" class="t2" font-size="12" font-weight="400" text-anchor="start">CPU and RSS of the three processes read every 1 s from /proc, averaged; 25 November 2026</text>
<text x="40.0" y="812.0" class="t3" font-size="12" font-weight="400" text-anchor="start">Note</text>
<text x="162.0" y="812.0" class="t2" font-size="12" font-weight="400" text-anchor="start">6 cores, so 100 % is about 17 % of the chip. Slower cores (S905X / Cortex-A53) need more CPU for the same speed.</text>
